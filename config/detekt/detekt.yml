# detekt gate config (MS-002, §12.3). The full default rule set applies because
# buildUponDefaultConfig=true is set Gradle-side in the root build (it is not
# a YAML key). This file only pins gate behavior.
config:
  validation: true
  warningsAsErrors: false
build:
  maxIssues: 0
naming:
  FunctionNaming:
    active: true
    # Uppercase names are idiomatic for @Composable functions.
    ignoreAnnotated:
      - 'Composable'
