appId: app.auplayer.debug
---
- launchApp
- assertVisible: "Library"
- tapOn: "Videos"
# MediaStore is seeded by tools/visual/run.sh before this flow runs.
- extendedWaitUntil:
    visible: "Sample Clip"
    timeout: 20000
- takeScreenshot: videos-library
- tapOn: "Sample Clip"
# The controls auto-hide, and the tap catcher only ever reveals them, so tap
# once to make the top bar assertable again. "Enhance: OFF" is stable text,
# unlike icon nodes which proved flaky under swiftshader.
- tapOn:
    point: "50%,35%"
- extendedWaitUntil:
    visible: "Enhance: OFF"
    timeout: 30000
- takeScreenshot: player-controls
# Playback itself is proven by run.sh: it compares two frames for movement,
# which no UI assert can fake.
- tapOn:
    point: "50%,35%"
- takeScreenshot: player-frame-a
- takeScreenshot: player-frame-b