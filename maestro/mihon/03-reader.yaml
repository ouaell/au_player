appId: app.auplayer.debug
---
- launchApp
- assertVisible: "Library"
- tapOn: "More options"
- tapOn: "Scan local folder"
- assertVisible: "Demo"
- tapOn: "Demo"
- takeScreenshot: series-first-open
- pressKey: back
- tapOn: "Demo"
- takeScreenshot: series-before-chapters
- assertVisible: "ch1"
- tapOn: "ch1"
- runFlow:
    when:
      visible: "Got it"
    commands:
      - tapOn: "Got it"
- takeScreenshot: reader-page
