appId: app.auplayer.debug
---
- launchApp
- assertVisible: "Library"
- tapOn: "Videos"
- extendedWaitUntil:
    visible: "Sample Clip"
    timeout: 20000
- tapOn: "Sample Clip"
# Controls auto-hide. Reveal them and tap the Enhance button back to back:
# inserting a waitForAnimationToComplete between them costs enough wall time
# for the bar to hide again, and the tap then lands on the reveal-catcher
# instead of the button, which silently opens nothing.
- tapOn:
    point: "50%,35%"
- tapOn: "Enhance: OFF"
- extendedWaitUntil:
    visible: "Anime"
    timeout: 15000
- takeScreenshot: enhance-sheet
- tapOn: "Anime"
- extendedWaitUntil:
    visible: "Enhance: ANIME"
    timeout: 15000
- takeScreenshot: enhance-applied-a
- takeScreenshot: enhance-applied-b