appId: app.auplayer.debug
---
- launchApp
- assertVisible: "Library"
- tapOn: "Videos"
- extendedWaitUntil:
    visible: "Sample Clip"
    timeout: 20000
- tapOn: "Sample Clip"
# Controls auto-hide after a few seconds, and a tap on the hidden state lands on
# the tap-catcher (which only reveals controls) instead of the button. Reveal
# first, then tap the button — same order that works in 04-videos.
- tapOn:
    point: "50%,35%"
- extendedWaitUntil:
    visible: "Enhance: OFF"
    timeout: 30000
- tapOn: "Enhance: OFF"
- extendedWaitUntil:
    visible: "Anime"
    timeout: 15000
- takeScreenshot: enhance-sheet
- tapOn: "Anime"
- extendedWaitUntil:
    visible: "Enhance: ANIME"
    timeout: 15000
- takeScreenshot: enhance-applied-a
- takeScreenshot: enhance-applied-b