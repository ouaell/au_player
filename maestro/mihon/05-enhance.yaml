appId: app.auplayer.debug
---
- launchApp
- assertVisible: "Library"
- tapOn: "Videos"
- extendedWaitUntil:
    visible: "Sample Clip"
    timeout: 20000
- tapOn: "Sample Clip"
# Controls auto-hide during playback, so the bar has to be revealed before it
# can be tapped. The tap catcher sits under the chrome and only reveals.
- tapOn:
    point: "50%,35%"
- extendedWaitUntil:
    visible: "Enhance: OFF"
    timeout: 30000
# Tapped by coordinate, not by text: the text node sits inside a merged
# semantics button and Maestro's lookup on it has proven unreliable here.
- tapOn:
    point: "87%,6%"
- extendedWaitUntil:
    visible: "Anime"
    timeout: 15000
- takeScreenshot: enhance-sheet
- tapOn: "Anime"
# Selecting closes the sheet and restarts the auto-hide clock, so the chip has
# to be revealed again before it can be asserted on.
- tapOn:
    point: "50%,35%"
- extendedWaitUntil:
    visible: "Enhance: ANIME"
    timeout: 15000
- takeScreenshot: enhance-applied-a
- tapOn:
    point: "50%,35%"
- takeScreenshot: enhance-applied-b