name: release
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android 36 SDK (preinstalled runner SDK)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Restore keystore (release signing, optional)
        env:
          AU_KEYSTORE_B64: ${{ secrets.AU_KEYSTORE_B64 }}
          AU_KEYSTORE_PASSWORD: ${{ secrets.AU_KEYSTORE_PASSWORD }}
          AU_KEY_ALIAS: ${{ secrets.AU_KEY_ALIAS }}
          AU_KEY_PASSWORD: ${{ secrets.AU_KEY_PASSWORD }}
        run: |
          if [ -n "$AU_KEYSTORE_B64" ]; then
            echo "$AU_KEYSTORE_B64" | base64 -d > release.keystore
            echo "AU_KEYSTORE_PATH=$PWD/release.keystore" >> "$GITHUB_ENV"
          else
            echo "No AU_KEYSTORE_B64 secret: release builds use the debug key (see docs/signing.md)."
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-read-only: false
      - name: Assemble + bundle direct release (MS-053)
        run: gradle :app:assembleDirectRelease :app:bundleDirectRelease --stacktrace
        env:
          AU_KEYSTORE_PASSWORD: ${{ secrets.AU_KEYSTORE_PASSWORD }}
          AU_KEY_ALIAS: ${{ secrets.AU_KEY_ALIAS }}
          AU_KEY_PASSWORD: ${{ secrets.AU_KEY_PASSWORD }}
      - name: 16KB alignment check (release)
        run: sh tools/check_16kb.sh app/build/outputs/apk/direct/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-release-apk
          path: app/build/outputs/apk/direct/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-release-aab
          path: app/build/outputs/bundle/directRelease/*.aab
