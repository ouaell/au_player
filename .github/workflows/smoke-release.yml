name: smoke-release
# MS-063 (emulator half; FTL half needs Firebase H6): minified release
# smoke on the CI emulator. Builds directRelease (R8 on, debug-signed),
# installs, plays a clip and opens a CBZ via VIEW intents, and asserts via
# logcat (VO/AO init, reader pages, no FATAL) — no instrumentation needed,
# so no debuggable/minified-test matrix. Manual dispatch.
on:
  workflow_dispatch: {}

jobs:
  r-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AU_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android 36 SDK (preinstalled runner SDK)
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pre-start adb + disk check
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb start-server
          df -h
          # No adb wait-for-device here: the emulator boots later inside the
          # runner step; waiting now would block forever (MS-063 lesson).
      - name: Release smoke on CI emulator (minified R8 build)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          script: sh tools/run_smoke_release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-release-reports
          path: |
            r-logcat.txt
