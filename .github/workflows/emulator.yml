name: emulator
on:
  workflow_dispatch:
    inputs:
      api-level:
        description: Android API level
        default: "30"
        required: false

jobs:
  e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AU_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android 36 SDK (preinstalled runner SDK)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-read-only: false
      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - name: Pre-start adb + disk check
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          df -h / | tail -1
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb kill-server || true
          adb start-server
          adb devices
      - name: E1 scenario on CI emulator (real engine, corpus clip)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api-level }}
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          script: sh tools/run_e1.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
            e1-shot-1.png
            e1-shot-2.png
            logcat.txt
