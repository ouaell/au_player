name: emulator
on:
  workflow_dispatch:
    inputs:
      api-level:
        description: Android API level
        default: "30"
        required: false

jobs:
  e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AU_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android 36 SDK (preinstalled runner SDK)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-read-only: false
      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - name: E1 scenario on CI emulator (real engine, corpus clip)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api-level }}
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          script: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
            sh tools/gen_corpus.sh test-corpus
            adb kill-server || true
            adb start-server
            adb wait-for-device
            adb_retry() {
              tries=0
              while [ $tries -lt 5 ]; do
                if "$@"; then return 0; fi
                tries=$((tries + 1))
                sleep 5
                adb kill-server || true
                adb start-server || true
                adb wait-for-device || true
              done
              return 1
            }
            gradle :app:installDirectDebug --stacktrace
            adb_retry adb push test-corpus/h264-720p.mp4 /data/local/tmp/e1.mp4
            adb_retry adb shell "run-as com.example.auplayer cp /data/local/tmp/e1.mp4 files/e1.mp4"
            adb_retry adb shell "run-as com.example.auplayer ls -l files/e1.mp4"
            TEST_FAILED=0
            gradle :app:connectedDirectDebugAndroidTest --stacktrace || TEST_FAILED=1
            echo "=== androidTest results ==="
            find app/build -name "*.xml" -path "*androidTest-results*" -exec grep -h "<testsuite " {} \; || true
            adb_retry adb pull /sdcard/Android/data/com.example.auplayer/files/e1-shot-1.png "$GITHUB_WORKSPACE/e1-shot-1.png" || true
            adb_retry adb pull /sdcard/Android/data/com.example.auplayer/files/e1-shot-2.png "$GITHUB_WORKSPACE/e1-shot-2.png" || true
            adb_retry adb logcat -d > "$GITHUB_WORKSPACE/logcat.txt" || echo "logcat unavailable" > "$GITHUB_WORKSPACE/logcat.txt"
            if grep -aiE 'FATAL EXCEPTION|native crash|ANR in' "$GITHUB_WORKSPACE/logcat.txt"; then
              echo "E: crash/ANR in logcat" >&2
              exit 1
            fi
            echo "E: logcat clean"
            exit $TEST_FAILED
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
            e1-shot-1.png
            e1-shot-2.png
            logcat.txt
