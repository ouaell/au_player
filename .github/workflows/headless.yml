name: headless
# MS-059 (H1+H2, §17.4): desktop-mpv checks on Linux CI — option lint +
# shader-compile for every chain under Xvfb + Mesa llvmpipe.
# Uses distro mpv (version drift vs pinned v0.41.0 is recorded in the log;
# llvmpipe proves correctness only, never performance). Manual dispatch.
on:
  workflow_dispatch: {}

jobs:
  h-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install mpv + Xvfb + Mesa + ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mpv xvfb mesa-utils-bin ffmpeg
          mpv --version | head -2
          echo "pinned: $(grep '^MPV_VERSION=' native/pins.txt || true)"
          echo "--- --list-options sample (format check) ---"
          mpv --list-options 2>&1 | head -5
      - name: Corpus + shaders
        run: |
          sh tools/gen_corpus.sh test-corpus
          sh tools/fetch_shaders.sh
          python3 tools/patch_shaders.py
          ls enhance/src/main/assets/shaders/patched/
      - name: H1 option lint
        run: sh tools/headless/option_lint.sh mpv
      - name: H2 shader compile (all chains)
        run: |
          sh tools/headless/shader_compile.sh mpv \
            enhance/src/main/assets/shaders/patched \
            test-corpus/h264-720p.mp4 headless-out
          echo "H2: all chains compiled without GLSL errors"
      - name: H4 subtitle render (MS-067 bootstrap-then-compare)
        run: |
          sh tools/fetch_fonts.sh
          mkdir -p headless-subs
          export DISPLAY="${DISPLAY:-:99}"
          for sub in sub-latin sub-arabic sub-cjk sub-styled; do
            ext=srt
            if [ "$sub" = "sub-styled" ]; then ext=ass; fi
            xvfb-run -a mpv --no-config --vo=image --vo-image-format=png \
              --vo-image-outdir="headless-subs/$sub" --hwdec=no --ao=null \
              --sub-file="tools/headless/fixtures/$sub.$ext" \
              --sub-fonts-dir=app/src/main/assets/fonts \
              --frames=45 test-corpus/h264-720p.mp4 \
              --msg-level=all=warn --log-file="headless-subs/$sub.log" || true
            ls "headless-subs/$sub" | head -3
          done
          if [ -d tools/headless/goldens ]; then
            for sub in sub-latin sub-arabic sub-cjk sub-styled; do
              # Frame 30 (~1s) carries the first cue; frame 1 is still blank.
              sh tools/headless/check_golden.sh "headless-subs/$sub/00000030.png" "tools/headless/goldens/$sub.png" 0.90
            done
            echo "H4: subtitle goldens match"
          else
            echo "H4: no goldens yet — commit headless-subs outputs as tools/headless/goldens/ to bootstrap"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-reports
          path: |
            headless-out/
            headless-subs/
