name: native
on:
  workflow_dispatch:
  push:
    paths:
      - native/**
      - .github/workflows/native.yml
      - tools/verify_native.sh
      - tools/check_16kb.sh

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # arm64 proven green; armv7l (release) + x86_64 (CI emulator, mandatory).
        arch: [arm64, armv7l, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned buildscripts
        uses: actions/checkout@v4
        with:
          repository: mpv-android/mpv-android
          ref: c2e02fe111541e4063ab8f868bf629649ed937a3
          path: upstream
          sparse-checkout: buildscripts
      - name: Stage scripts + verify pin
        run: |
          grep -q '^MPV_ANDROID_SHA=c2e02fe111541e4063ab8f868bf629649ed937a3$' native/pins.txt
          rm -rf buildscripts
          mv upstream/buildscripts ./buildscripts
          rm -rf upstream scripts.tgz
          test -f buildscripts/scripts/ffmpeg.sh
          test -f buildscripts/scripts/mpv.sh
          test -f buildscripts/include/download-deps.sh
          test -f buildscripts/buildall.sh
          echo "scripts ready"
      - name: Apply LGPL patches
        run: python3 native/apply_patches.py buildscripts
      - name: Cache prefix + sources
        uses: actions/cache@v4
        with:
          path: |
            buildscripts/prefix/${{ matrix.arch }}
            buildscripts/deps
          key: native-${{ matrix.arch }}-${{ hashFiles('native/pins.txt') }}
      - name: Download deps + SDK/NDK
        working-directory: buildscripts
        run: ./download.sh
      - name: Upgrade meson (fontconfig needs >= 1.11)
        run: |
          pip3 install -U meson ninja
          meson --version
          ninja --version
      - name: Build mpv + deps
        working-directory: buildscripts
        run: ./buildall.sh --arch ${{ matrix.arch }} mpv
      - name: Verify LGPL + alignment
        run: |
          # shellcheck disable=SC2046
          sh tools/check_16kb.sh $(find "buildscripts/prefix/${{ matrix.arch }}/lib" -name '*.so')
          echo "--- license strings (libmpv must be GPL-free) ---"
          if strings "buildscripts/prefix/${{ matrix.arch }}/lib/libmpv.so" | grep -aiE 'General Public License|AGPL|nonfree|enable-gpl' | grep -av 'Lesser General Public'; then
            echo "GPL markers in libmpv.so" >&2
            exit 1
          fi
          echo "OK: no GPL markers"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.arch }}
          path: buildscripts/prefix/${{ matrix.arch }}/
