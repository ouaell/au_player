name: android-t1
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: t1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android 36 SDK (preinstalled runner SDK)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Forbidden-string gate (MS-002)
        run: sh tools/check_forbidden.sh
      - name: License allowlist gate (MS-002)
        run: sh tools/check_licenses.sh
      - name: Notices coverage gate (MS-051)
        run: sh tools/check_notices.sh
      - name: Shader fetch + patch + static check (MS-026)
        run: |
          sh tools/fetch_shaders.sh
          python3 tools/patch_shaders.py
          sh tools/check_shaders.sh
      - name: Test media corpus (MS-058)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          sh tools/gen_corpus.sh test-corpus
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-read-only: false
      - name: Gates + unit tests + build (MS-002)
        run: gradle detekt ktlintCheck test lint assembleDirectDebug --stacktrace
      - name: 16KB alignment check (MS-002)
        run: sh tools/check_16kb.sh app/build/outputs/apk/direct/debug/*.apk
      - name: Native + release verifiers (MS-062)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: sh tools/verify_native.sh app/build/outputs/apk/direct/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-debug-apk
          path: app/build/outputs/apk/direct/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-corpus
          path: test-corpus/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-reports
          path: |
            **/build/reports/
            **/build/test-results/
